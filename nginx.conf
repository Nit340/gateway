# =============================================================================
#  Univa Gateway – nginx.conf  (Edge Device / Windows)
#
#  Serves:  http://univa-gateway.local   ← mDNS (Avahi/Bonjour)
#           http://localhost             ← local fallback
#           http://<device-ip>           ← direct IP fallback
#
#  Port 80 only — no port number needed in the browser URL.
#  Network switching (WiFi ↔ LTE ↔ Ethernet) works without session expiry.
# =============================================================================

# worker_processes  1;

# Log locations adjusted for Windows (relative to Nginx execution directory)
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       nginx/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ── WebSocket upgrade map ─────────────────────────────────────────────
    # Convert the Upgrade header into the correct Connection value.
    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ''        close;
    }

    # Log format and path adjusted for Windows
    log_format  main  '$remote_addr [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer"';
    access_log  logs/access.log  main;

    # =========================================================================
    server {
        listen 5700 default_server;
        # listen [::]:5700 default_server; # Can uncomment if IPv6 is supported on the target Windows system

        # Responds to mDNS hostname AND any raw IP
        server_name  univa-gateway.local _;

        # ── Frontend static files ─────────────────────────────────────────
        # Serve the frontend files from the workspace directory
        root D:/Work/CMS/gateway/frontend;
        index  login.html;
        default_type  text/html;

        # ── Timeouts – important on LTE (higher RTT) ──────────────────────
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-XSS-Protection        "1; mode=block" always;

        # ── Common proxy headers (shared by all proxy locations) ──────────
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # CRITICAL: always forward cookies so gw_webui_session reaches aiohttp
        proxy_set_header    Cookie            $http_cookie;
        proxy_pass_header   Set-Cookie;

        # ---------- HTTP API PROXY ----------
        location /api/ {
            proxy_pass  http://127.0.0.1:8082;

            # Disable buffering so streaming / SSE responses flow immediately
            proxy_buffering  off;
        }

        # ---------- WEBSOCKET PROXY ----------
        location /ws/ {
            proxy_pass  http://127.0.0.1:8082;

            # WebSocket protocol upgrade
            proxy_set_header  Upgrade     $http_upgrade;
            proxy_set_header  Connection  $connection_upgrade;

            # Keep WebSocket connections alive for up to 1 hour
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ---------- ROOT → index.html (auth redirect logic) ----------
        location = / {
            try_files /index.html =404;
        }

        # ---------- EXTENSIONLESS ROUTES ----------
        location = /login {
            add_header Content-Type "text/html; charset=UTF-8";
            try_files /login.html =404;
        }

        location = /index {
            add_header Content-Type "text/html; charset=UTF-8";
            try_files /index.html =404;
        }

        # ---------- APP PAGE ROUTES (all serve layout.html) ----------
        location ~ ^/(general-configuration|device-management|field-integration|mqtt-cloud|ota-gateway|craneiq|data-retention|logging|diagnostics|security|license|automation|alerts|rules|backup|notification|layout)$ {
            add_header Content-Type "text/html; charset=UTF-8";
            try_files /layout.html =404;
        }

        # ---------- STATIC FILES ----------
        location / {
            try_files $uri $uri/ =404;
        }
    }
}