<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univa Gateway – Login</title>
    <link href="assets/css/tailwind.css" rel="stylesheet">
    <script src="assets/js/fontawesome.js"></script>
    <link href="assets/css/fonts.css" rel="stylesheet">
    <link rel="icon" href="assets/images/favicon.png">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #F1F5F9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 400px;
        }

        .input-field {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1.5px solid #E2E8F0;
            border-radius: 8px;
            font-size: 14px;
            color: #1E293B;
            background: #F8FAFC;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .input-field:focus {
            border-color: #2563EB;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .input-field.error {
            border-color: #EF4444;
            background: #FFF8F8;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            font-size: 13px;
            pointer-events: none;
        }

        .btn-login {
            width: 100%;
            padding: 11px;
            background: #2563EB;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover { background: #1D4ED8; }
        .btn-login:active { transform: scale(0.99); }
        .btn-login:disabled { background: #93C5FD; cursor: not-allowed; transform: none; }

        .error-banner {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #DC2626;
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .error-banner.show { display: flex; }

        .spinner-sm {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .btn-login.loading .spinner-sm { display: block; }
        .btn-login.loading .btn-text   { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .brand-bar {
            height: 4px;
            background: linear-gradient(90deg, #2563EB, #60A5FA);
            border-radius: 16px 16px 0 0;
            margin: -48px -40px 40px;
        }

        /* ── Network connecting banner ───────────────────────── */
        #netBanner {
            background: #FFFBEB;
            border: 1px solid #FDE68A;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #92400E;
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        #netBanner.show { display: flex; }
        #netBanner.error-mode {
            background: #FEF2F2;
            border-color: #FECACA;
            color: #DC2626;
        }

        /* Small WiFi pulse icon */
        .net-pulse {
            position: relative;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .net-pulse i { font-size: 13px; color: #D97706; z-index: 1; position: relative; }
        .net-pulse::before, .net-pulse::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid #F59E0B;
            opacity: 0;
            animation: loginRing 1.6s ease-out infinite;
        }
        .net-pulse::after { animation-delay: 0.6s; }
        @keyframes loginRing {
            0%   { opacity: 0.7; transform: scale(0.6); }
            100% { opacity: 0;   transform: scale(1.5); }
        }
        #netBanner.error-mode .net-pulse i { color: #DC2626; }
        #netBanner.error-mode .net-pulse::before,
        #netBanner.error-mode .net-pulse::after { border-color: #EF4444; animation: none; opacity: 0; }

        /* Dot loader */
        .net-dots span {
            display: inline-block;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: #D97706;
            margin: 0 1px;
            animation: netDot 1.2s ease-in-out infinite;
        }
        .net-dots span:nth-child(2) { animation-delay: 0.2s; }
        .net-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes netDot {
            0%,80%,100% { transform: scale(0.7); opacity: 0.4; }
            40%          { transform: scale(1);   opacity: 1;   }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-bar"></div>

        <!-- Logo & Title -->
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; background: #EFF6FF; border-radius: 14px; margin-bottom: 16px;">
                <i class="fa-solid fa-satellite-dish" style="color: #2563EB; font-size: 22px;"></i>
            </div>
            <h1 style="font-size: 20px; font-weight: 700; color: #1E293B; margin: 0 0 4px;">Univa Gateway</h1>
            <p style="font-size: 13px; color: #64748B; margin: 0;">Sign in to your account</p>
        </div>

        <!-- Network / Connecting Banner -->
        <div id="netBanner">
            <div class="net-pulse"><i class="fa-solid fa-wifi" id="netBannerIcon"></i></div>
            <div style="flex:1; min-width:0;">
                <div id="netBannerMsg" style="font-weight:600; margin-bottom:2px;">Connecting to gateway…</div>
                <div id="netBannerSub" style="font-size:11px; opacity:0.8; display:flex; align-items:center; gap:4px;">
                    <span id="netBannerSubText">Please wait</span>
                    <span class="net-dots"><span></span><span></span><span></span></span>
                </div>
            </div>
        </div>

        <!-- Session Expired Banner -->
        <div class="error-banner" id="expiredBanner" style="background:#FFFBEB;border-color:#FDE68A;color:#92400E;">
            <i class="fa-solid fa-clock-rotate-left" style="flex-shrink:0;color:#D97706;"></i>
            <span>Your session has expired. Please sign in again.</span>
        </div>

        <!-- Error Banner -->
        <div class="error-banner" id="errorBanner">
            <i class="fa-solid fa-circle-exclamation" style="flex-shrink:0;"></i>
            <span id="errorMessage">Invalid username or password.</span>
        </div>

        <!-- Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- Username -->
            <label style="display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px;">
                Username
            </label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user input-icon"></i>
                <input
                    type="text"
                    id="username"
                    class="input-field"
                    placeholder="Enter username"
                    autocomplete="username"
                    autofocus
                />
            </div>

            <!-- Password -->
            <label style="display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px;">
                Password
            </label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input
                    type="password"
                    id="password"
                    class="input-field"
                    placeholder="Enter password"
                    autocomplete="current-password"
                />
            </div>

            <!-- Submit -->
            <div style="margin-top: 8px;">
                <button type="submit" class="btn-login" id="loginBtn">
                    <div class="spinner-sm"></div>
                    <span class="btn-text"><i class="fa-solid fa-right-to-bracket"></i> &nbsp;Sign In</span>
                </button>
            </div>
        </form>

        <p style="text-align:center; font-size:12px; color:#94A3B8; margin: 24px 0 0;">
            Powered By Innospace Automation Services Pvt Ltd
        </p>
    </div>

    <script>
        // ── Elements ─────────────────────────────────────────────────
        const netBanner     = document.getElementById('netBanner');
        const netBannerMsg  = document.getElementById('netBannerMsg');
        const netBannerSub  = document.getElementById('netBannerSub');
        const netBannerSubT = document.getElementById('netBannerSubText');
        const netBannerIcon = document.getElementById('netBannerIcon');

        // ── Network banner helpers ────────────────────────────────────
        function showNetBanner(msg, sub, isError) {
            netBannerMsg.textContent = msg;
            netBannerSubT.textContent = sub || 'Please wait';
            netBanner.classList.toggle('error-mode', !!isError);
            netBanner.classList.add('show');
            netBannerIcon.className = isError ? 'fa-solid fa-wifi-exclamation' : 'fa-solid fa-wifi';
        }

        function hideNetBanner() {
            netBanner.classList.remove('show', 'error-mode');
        }

        // ── One-time auth check on load (no polling — never loops) ────
        // If already authenticated, skip the login and go straight in.
        let authCheckDone = false;
        (async function () {
            if (authCheckDone) return;
            authCheckDone = true;
            try {
                const res = await fetch('/api/auth/status', {
                    credentials: 'same-origin',
                    cache: 'no-store',
                    signal: AbortSignal.timeout(4000)
                });
                if (res.ok) {
                    window.location.replace('/layout.html');
                }
                // 401 → not logged in → stay here, no banner
            } catch (e) {
                // Server temporarily unreachable on load — don't show anything,
                // user just landed on the login page. They'll get the banner when they try to sign in.
            }
        })();

        // ── Session expired banner ────────────────────────────────────
        if (new URLSearchParams(window.location.search).get('expired') === '1') {
            document.getElementById('expiredBanner').classList.add('show');
        }

        // ── Retry state ───────────────────────────────────────────────
        let retryTimer  = null;
        let retryCount  = 0;

        function clearRetry() {
            if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
            retryCount = 0;
        }

        function showError(msg) {
            clearRetry();
            hideNetBanner();
            const banner = document.getElementById('errorBanner');
            document.getElementById('errorMessage').textContent = msg;
            banner.classList.add('show');
        }

        // ── Network-retry after a failed fetch (server unreachable) ───
        // Uses exponential back-off: 3s → 5s → 9s → max 30s
        function scheduleRetry(username, password) {
            retryCount++;
            const BASE = 3000, MAX = 30000;
            const delay = Math.min(BASE * Math.pow(1.6, retryCount - 1), MAX);
            const secs  = Math.round(delay / 1000);

            let elapsed = 0;
            const TICK = 500;

            function tick() {
                elapsed += TICK;
                const left = Math.max(0, Math.round((delay - elapsed) / 1000));
                if (left > 0) {
                    showNetBanner(
                        'Gateway unreachable — retrying…',
                        'Attempt ' + retryCount + ' · retrying in ' + left + 's'
                    );
                    retryTimer = setTimeout(tick, TICK);
                } else {
                    showNetBanner('Connecting to gateway…', 'Attempt ' + (retryCount + 1));
                    retryTimer = setTimeout(() => doLogin(username, password), 50);
                }
            }

            showNetBanner(
                'Gateway unreachable — retrying…',
                'Attempt ' + retryCount + ' · retrying in ' + secs + 's'
            );
            retryTimer = setTimeout(tick, TICK);
        }

        // ── Core login fetch ──────────────────────────────────────────
        async function doLogin(username, password) {
            const btn    = document.getElementById('loginBtn');
            const banner = document.getElementById('errorBanner');

            banner.classList.remove('show');
            hideNetBanner();
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'same-origin',
                    signal: AbortSignal.timeout(8000)
                });

                const data = await response.json();

                if (data.success) {
                    clearRetry();
                    hideNetBanner();
                    window.location.replace('/layout.html');
                } else {
                    // Wrong credentials — stop retrying, show error
                    clearRetry();
                    hideNetBanner();
                    document.getElementById('errorMessage').textContent =
                        data.error || 'Invalid username or password.';
                    banner.classList.add('show');
                    document.getElementById('username').classList.add('error');
                    document.getElementById('password').classList.add('error');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }

            } catch (err) {
                // Network/server unreachable — show retrying countdown
                scheduleRetry(username, password);

            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        // ── Form submit ───────────────────────────────────────────────
        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Clear all banners
            clearRetry();
            hideNetBanner();
            document.getElementById('errorBanner').classList.remove('show');
            document.getElementById('expiredBanner').classList.remove('show');
            document.getElementById('username').classList.remove('error');
            document.getElementById('password').classList.remove('error');

            if (!username || !password) {
                showError('Please enter both username and password.');
                if (!username) document.getElementById('username').classList.add('error');
                if (!password) document.getElementById('password').classList.add('error');
                return;
            }

            retryCount = 0;
            await doLogin(username, password);
        }

        // ── Clear errors on input ─────────────────────────────────────
        ['username', 'password'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                clearRetry();
                hideNetBanner();
                document.getElementById(id).classList.remove('error');
                document.getElementById('errorBanner').classList.remove('show');
                document.getElementById('expiredBanner').classList.remove('show');
            });
        });

        // ── Browser online event: if we're mid-retry, probe immediately
        window.addEventListener('online', () => {
            if (retryTimer && retryCount > 0) {
                clearTimeout(retryTimer);
                retryTimer = null;
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value;
                if (u && p) {
                    showNetBanner('Network restored — connecting…', 'Contacting gateway');
                    retryTimer = setTimeout(() => doLogin(u, p), 500);
                }
            }
        });
    </script>
</body>
</html>
