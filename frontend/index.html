<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Univa Gateway</title>
</head>
<body>
    <script>
        // Always verify with server - never trust cookie alone.
        // If backend restarted, session is gone and user must log in again.
        (async function () {
            try {
                const res = await fetch('/api/auth/status', { credentials: 'same-origin' });
                if (res.ok) {
                    window.location.replace('/layout.html');
                } else {
                    window.location.replace('/login.html');
                }
            } catch (e) {
                window.location.replace('/login.html');
            }
        })();
    </script>
</body>
</html>
