<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Univa Gateway</title>
</head>
<body>
    <script>
        (async function () {
            // Preserve any query params (e.g. ?expired=1) when bouncing to login
            const params = window.location.search;
            try {
                const res = await fetch('/api/auth/status', { credentials: 'same-origin' });
                if (res.ok) {
                    // Valid session — go straight to app, skip login
                    window.location.replace('/layout.html');
                } else {
                    window.location.replace('/login.html' + params);
                }
            } catch (e) {
                window.location.replace('/login.html' + params);
            }
        })();
    </script>
</body>
</html>
