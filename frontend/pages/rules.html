<!-- rules.html -->
<!-- This is the main content only, to be loaded dynamically -->
<div class="opacity-50 pointer-events-none select-none max-w-[1600px] mx-auto p-6 space-y-6">
        
            
            <!-- Page Title & Actions -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Rules Engine</h1>
                    <p class="text-slate-500 text-sm mt-1">Define conditions that trigger alerts when met.</p>
                </div>
                <div class="flex gap-2">
                    <button class="inline-flex items-center px-4 py-2 text-primary border border-primary text-sm font-medium rounded-lg hover:bg-blue-50 transition" data-action="redirectToAlerts()">
                        <i class="fa-solid fa-bell mr-2"></i> Manage Alerts
                    </button>
                    <button class="inline-flex items-center px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primaryHover transition shadow-sm" data-action="startCreatingNewRule()">
                        <i class="fa-solid fa-plus mr-2"></i> Create New Rule
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <!-- Left Column: Rules List -->
                <div id="rules-list-section" class="lg:col-span-4 space-y-4">
                    <div class="card h-[800px] flex flex-col bg-white">
                        <div class="card-header flex justify-between items-center">
                            <h3 class="font-semibold text-slate-800">Active Rules</h3>
                            <div class="flex space-x-2">
                                <button class="text-slate-400 hover:text-primary transition p-1.5 rounded hover:bg-slate-100" data-action="showFilterModal()">
                                    <i class="fa-solid fa-filter"></i>
                                </button>
                                <button class="text-slate-400 hover:text-primary transition p-1.5 rounded hover:bg-slate-100" data-action="toggleSortOrder()">
                                    <i class="fa-solid fa-sort" id="sort-icon"></i>
                                </button>
                                <button class="text-slate-400 hover:text-primary transition p-1.5 rounded hover:bg-slate-100" data-action="refreshRules()">
                                    <i class="fa-solid fa-sync-alt" id="refresh-icon"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="overflow-y-auto flex-1 p-2 space-y-2" id="rules-list">
                            <!-- Rule cards will be dynamically loaded -->
                        </div>
                        
                        <div class="p-4 border-t border-border bg-white">
                            <button class="w-full py-2 border border-dashed border-slate-300 rounded-lg text-slate-500 text-sm hover:border-primary hover:text-primary hover:bg-blue-50 transition flex items-center justify-center gap-2" data-action="showImportModal()">
                                <i class="fa-solid fa-download"></i> Import Rules
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Rule Editor Wizard -->
                <div id="rule-editor-section" class="lg:col-span-8">
                    <div class="card h-full flex flex-col bg-white" id="rule-editor-card">
                        
                        <!-- Wizard Header -->
                        <div class="p-6 border-b border-border rule-editor-header" id="rule-editor-header">
                            <div class="flex justify-between items-center mb-6">
                                <h2 class="text-xl font-bold text-slate-900" id="rule-editor-title">Create New Rule</h2>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs font-semibold uppercase text-slate-400 tracking-wider">Rule Status</span>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="rule-status-toggle" checked>
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                            </div>
                            
                            <!-- Progress Steps -->
                            <div class="flex items-center justify-between relative">
                                <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-slate-100 -z-10"></div>
                                
                                <button class="flex items-center gap-2 bg-white pr-4 z-10" data-action="goToStep(1)">
                                    <div id="step-1-indicator" class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-bold shadow-sm ring-4 ring-white">1</div>
                                    <span class="text-sm font-semibold text-slate-900">Trigger</span>
                                </button>
                                
                                <button class="flex items-center gap-2 bg-white px-4 z-10" data-action="goToStep(2)">
                                    <div id="step-2-indicator" class="w-8 h-8 rounded-full bg-white border-2 border-border text-slate-500 flex items-center justify-center text-sm font-semibold shadow-sm ring-4 ring-white">2</div>
                                    <span class="text-sm font-medium text-slate-500">Conditions</span>
                                </button>
                                
                                <button class="flex items-center gap-2 bg-white pl-4 z-10" data-action="goToStep(3)">
                                    <div id="step-3-indicator" class="w-8 h-8 rounded-full bg-white border-2 border-border text-slate-500 flex items-center justify-center text-sm font-semibold shadow-sm ring-4 ring-white">3</div>
                                    <span class="text-sm font-medium text-slate-500">Alerts</span>
                                </button>
                            </div>
                        </div>

                        <!-- Wizard Content -->
                        <div class="flex-1 overflow-y-auto" id="wizard-content-container">
                            <!-- Content will be loaded dynamically -->
                            <div id="wizard-content" class="p-6 space-y-8">
                                <!-- Default content for create mode -->
                            </div>
                        </div>

                        <!-- Wizard Footer -->
                        <div class="p-6 border-t border-border bg-slate-50" id="wizard-footer">
                            <div class="flex justify-between items-center">
                                <div class="text-sm text-slate-500">
                                    <span class="font-medium text-slate-700">Rule ID:</span> <span id="rule-id-display">RULE-NEW</span>
                                </div>
                                <div class="flex gap-3">
                                    <button class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg border border-slate-300 transition-colors" data-action="testRule()">
                                        Test Rule
                                    </button>
                                    <button class="px-4 py-2 text-sm font-medium text-white bg-primary hover:bg-primaryHover rounded-lg shadow-sm transition-colors" data-action="saveRule()">
                                        Save Rule
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        
</div>

<!-- Toast Container -->
<div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

<!-- Modals Container -->
<div id="rules-modals-container"></div>

<!-- Data Attributes for JavaScript -->
<div id="rules-data" style="display: none;" 
     data-api-endpoints='{
        "list": "/api/rules",
        "create": "/api/rules/create",
        "update": "/api/rules/update",
        "delete": "/api/rules/delete",
        "test": "/api/rules/test"
     }'>
</div>

<!-- Page-specific styles -->
<style>
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        backdrop-filter: blur(4px);
        display: none;
    }
    
    .modal-overlay.active {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .toggle-switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
    }
    
    .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }
    
    .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #CBD5E1;
        transition: 0.3s;
        border-radius: 24px;
    }
    
    .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.3s;
        border-radius: 50%;
    }
    
    .toggle-switch input:checked + .toggle-slider {
        background-color: #2563EB;
    }
    
    .toggle-switch input:checked + .toggle-slider:before {
        transform: translateX(20px);
    }
</style>
