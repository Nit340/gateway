<!-- rules.html -->
<!-- This is the main content only, to be loaded dynamically -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Rules Engine</h1>
            <p class="text-slate-500 text-sm mt-1">Define conditions that trigger alerts when met.</p>
        </div>
        <div class="flex gap-3">
            <button class="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm hover:bg-purple-700 transition-colors shadow-sm flex items-center gap-2" onclick="window.createGroupRule()">
                <i class="fa-solid fa-layer-group"></i>
                Group Rule
            </button>
            <button class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm hover:bg-red-700 transition-colors shadow-sm flex items-center gap-2" onclick="window.createEmergencyRule()">
                <i class="fa-solid fa-triangle-exclamation"></i>
                Emergency Rule
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Rules List -->
        <div id="rules-list-section" class="lg:col-span-4 space-y-4">
            <section class="bg-white rounded-xl shadow-sm border border-border p-6 h-[800px] flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold text-slate-800 flex items-center">
                        <i class="fa-regular fa-list-alt mr-2 text-primary"></i>
                        Active Rules
                    </h3>
                    <div class="flex space-x-2">
                        <button class="text-slate-400 hover:text-primary transition p-1.5 rounded hover:bg-slate-100" onclick="window.showFilterModal()" title="Filter">
                            <i class="fa-solid fa-filter"></i>
                        </button>
                        <button class="text-slate-400 hover:text-primary transition p-1.5 rounded hover:bg-slate-100" onclick="window.toggleSortOrder()" title="Sort">
                            <i class="fa-solid fa-sort" id="sort-icon"></i>
                        </button>
                        <button class="text-slate-400 hover:text-primary transition p-1.5 rounded hover:bg-slate-100" onclick="window.refreshRules()" title="Refresh">
                            <i class="fa-solid fa-sync-alt" id="refresh-icon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="overflow-y-auto flex-1 space-y-2 pr-1" id="rules-list">
                    <!-- Rule cards will be dynamically loaded -->
                </div>
                
                <div class="pt-4 border-t border-border mt-4">
                    <button class="w-full py-2 border border-dashed border-slate-300 rounded-lg text-slate-500 text-sm hover:border-primary hover:text-primary hover:bg-blue-50 transition flex items-center justify-center gap-2" onclick="window.showImportModal()">
                        <i class="fa-solid fa-download"></i> Import Rules
                    </button>
                </div>
            </section>
        </div>

        <!-- Right Column: Rule Editor Wizard -->
        <div id="rule-editor-section" class="lg:col-span-8">
            <section class="bg-white rounded-xl shadow-sm border border-border h-full flex flex-col" id="rule-editor-card">
                
                <!-- Wizard Header -->
                <div class="p-6 border-b border-border" id="rule-editor-header">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-slate-900" id="rule-editor-title">Create New Rule</h2>
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-semibold uppercase text-slate-400 tracking-wider">Rule Status</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="rule-status-toggle" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Progress Steps -->
                    <div class="flex items-center justify-between relative">
                        <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-slate-100 -z-10"></div>
                        
                        <button class="flex items-center gap-2 bg-white pr-4 z-10" onclick="window.goToStep(1)">
                            <div id="step-1-indicator" class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-bold shadow-sm ring-4 ring-white">1</div>
                            <span class="text-sm font-semibold text-slate-900">Trigger</span>
                        </button>
                        
                        <button class="flex items-center gap-2 bg-white px-4 z-10" onclick="window.goToStep(2)">
                            <div id="step-2-indicator" class="w-8 h-8 rounded-full bg-white border-2 border-border text-slate-500 flex items-center justify-center text-sm font-semibold shadow-sm ring-4 ring-white">2</div>
                            <span class="text-sm font-medium text-slate-500">Conditions</span>
                        </button>
                        
                        <button class="flex items-center gap-2 bg-white pl-4 z-10" onclick="window.goToStep(3)">
                            <div id="step-3-indicator" class="w-8 h-8 rounded-full bg-white border-2 border-border text-slate-500 flex items-center justify-center text-sm font-semibold shadow-sm ring-4 ring-white">3</div>
                            <span class="text-sm font-medium text-slate-500">Alerts</span>
                        </button>
                    </div>
                </div>

                <!-- Wizard Content -->
                <div class="flex-1 overflow-y-auto p-6" id="wizard-content-container">
                    <div id="wizard-content" class="space-y-6">
                        <!-- Content will be loaded dynamically -->
                    </div>
                </div>

                <!-- Wizard Footer -->
                <div class="p-6 border-t border-border bg-slate-50 rounded-b-xl" id="wizard-footer">
                    <div class="flex justify-between items-center">
                        <div class="text-sm text-slate-500">
                            <span class="font-medium text-slate-700">Rule ID:</span> 
                            <span id="rule-id-display" class="font-mono bg-white px-2 py-1 rounded border border-slate-200">RULE-NEW</span>
                        </div>
                        <div class="flex gap-3">
                            <button type="button" class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 hover:border-slate-400 transition-colors" onclick="window.testRule()">
                                <i class="fa-solid fa-flask mr-2"></i> Test Rule
                            </button>
                            <button type="button" class="px-4 py-2 text-sm font-medium text-white bg-primary hover:bg-primaryHover rounded-lg transition-colors shadow-sm" onclick="window.saveRule()">
                                <i class="fa-solid fa-floppy-disk mr-2"></i> Save Rule
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<!-- Notification Container -->
<div id="notification-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

<!-- Modals Container -->
<div id="rules-modals-container"></div>

<!-- Page-specific styles - matching general-config theme -->
<style>
    /* Modal overlay - matching general-config */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        backdrop-filter: blur(4px);
        display: none;
    }
    
    .modal-overlay.active {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    /* Toggle switch - matching general-config */
    .toggle-switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
    }
    
    .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }
    
    .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #CBD5E1;
        transition: 0.3s;
        border-radius: 24px;
    }
    
    .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.3s;
        border-radius: 50%;
    }
    
    .toggle-switch input:checked + .toggle-slider {
        background-color: #2563EB;
    }
    
    .toggle-switch input:checked + .toggle-slider:before {
        transform: translateX(20px);
    }
    
    /* Notification styles - matching general-config */
    .notification-toast {
        animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
        from {
            transform: translateX(100%);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    
    .notification-toast.fade-out {
        animation: slideOut 0.3s ease-in forwards;
    }
    
    @keyframes slideOut {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(100%);
            opacity: 0;
        }
    }
    
    /* Custom scrollbar */
    .overflow-y-auto::-webkit-scrollbar {
        width: 6px;
    }
    
    .overflow-y-auto::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 10px;
    }
    
    .overflow-y-auto::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
    }
</style>
