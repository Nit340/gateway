<!-- alerts.html -->
<!-- This is the main content only, to be loaded dynamically -->
<div class="max-w-[1600px] mx-auto p-6 space-y-8">
        
            
            <!-- Page Title & Description -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Alert Messages</h1>
                    <p class="text-slate-500 text-sm mt-1">Define alert severity classes and message templates</p>
                </div>
                <div class="flex gap-2">
                    <button class="inline-flex items-center px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 transition" data-action="exportConfiguration()">
                        <i class="fa-solid fa-download mr-2"></i> Export Config
                    </button>
                    <button class="inline-flex items-center px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primaryHover transition shadow-sm" data-action="showLivePreview()">
                        <i class="fa-solid fa-eye mr-2"></i> Live Preview
                    </button>
                </div>
            </div>

            <!-- Section 1: Alert Classes -->
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-800">Alert Classes</h2>
                        <p class="text-sm text-slate-500">Define severity levels with visual properties</p>
                    </div>
                    <button class="inline-flex items-center px-3 py-1.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primaryHover transition" data-action="showAddAlertClassModal()">
                        <i class="fa-solid fa-plus mr-2"></i> Add Class
                    </button>
                </div>
                
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Class Name</th>
                                <th>Severity</th>
                                <th>Color</th>
                                <th>Icon</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="alert-classes-table">
                            <!-- Alert classes will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Section 2: Alert Messages -->
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-800">Alert Messages</h2>
                        <p class="text-sm text-slate-500">Create message templates with delivery channels</p>
                    </div>
                    <button class="inline-flex items-center px-3 py-1.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primaryHover transition" data-action="showAddAlertMessageModal()">
                        <i class="fa-solid fa-plus mr-2"></i> Add Message
                    </button>
                </div>
                
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Alert Name</th>
                                <th>Message Template</th>
                                <th>Class</th>
                                <th>Channels</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="alert-messages-table">
                            <!-- Alert messages will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        
</div>

<!-- Toast Container -->
<div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

<!-- Modals Container -->
<div id="alerts-modals-container"></div>

<!-- Data Attributes for JavaScript -->
<div id="alerts-data" style="display: none;" 
     data-api-endpoints='{
        "list": "/api/alerts/classes",
        "create": "/api/alerts/classes/create",
        "update": "/api/alerts/classes/update",
        "test": "/api/alerts/test"
     }'>
</div>

<!-- Page-specific styles -->
<style>
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        backdrop-filter: blur(4px);
        display: none;
    }
    
    .modal-overlay.active {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .toggle-switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
    }
    
    .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }
    
    .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #CBD5E1;
        transition: 0.3s;
        border-radius: 24px;
    }
    
    .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.3s;
        border-radius: 50%;
    }
    
    .toggle-switch input:checked + .toggle-slider {
        background-color: #2563EB;
    }
    
    .toggle-switch input:checked + .toggle-slider:before {
        transform: translateX(20px);
    }
</style>
