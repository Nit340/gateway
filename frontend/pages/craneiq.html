<!-- craneiq.html -->
<div style="max-width:680px;margin:40px auto;padding:0 20px;font-family:sans-serif;">

    <!-- Load Cell Card -->
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;">

        <!-- Header -->
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
            <div style="width:38px;height:38px;background:#fff7ed;border-radius:8px;display:flex;align-items:center;justify-content:center;">
                <svg width="18" height="18" fill="none" stroke="#ea580c" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2L8 6H4v4l-2 2 2 2v4h4l4 4 4-4h4v-4l2-2-2-2V6h-4z"/></svg>
            </div>
            <div>
                <div style="font-size:15px;font-weight:600;color:#1e293b;">Load Cell</div>
                <div style="font-size:11px;color:#94a3b8;" id="lc-device-label">Not connected</div>
            </div>
        </div>

        <!-- Idle / Device select -->
        <div id="lc-idle" style="padding:8px 0 4px;">
            <div style="display:flex;align-items:center;gap:10px;">
                <select id="lc-device-select"
                    style="flex:1;padding:9px 12px;font-size:13px;color:#1e293b;border:1px solid #e2e8f0;border-radius:6px;outline:none;background:#f8fafc;">
                    <option value="">Loading devices...</option>
                </select>
                <button id="pipeline-connect-btn" onclick="togglePipelineConnection()"
                    style="padding:9px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;white-space:nowrap;">
                    Connect
                </button>
            </div>
            <div id="lc-no-devices" style="display:none;margin-top:10px;font-size:12px;color:#ef4444;">
                No Load Cell device found. Add one in Device Management first.
            </div>
        </div>

        <!-- Live + Calibration (all in one, shown when connected) -->
        <div id="lc-live" style="display:none;">

            <!-- Live raw value -->
            <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;">
                <div style="text-align:center;flex:1;padding:10px 0 16px;border-bottom:1px solid #f1f5f9;">
                    <div style="font-size:10px;font-weight:600;letter-spacing:2px;color:#94a3b8;text-transform:uppercase;margin-bottom:6px;">load_raw</div>
                    <div style="font-size:52px;font-weight:700;color:#1e293b;line-height:1;" id="lc-raw-value">--</div>
                    <div style="display:flex;align-items:center;justify-content:center;gap:5px;margin-top:6px;">
                        <span style="width:6px;height:6px;background:#22c55e;border-radius:50%;display:inline-block;animation:lcpulse 1.5s infinite;"></span>
                        <span style="font-size:11px;color:#22c55e;font-weight:500;">Live</span>
                    </div>
                </div>
                <button onclick="togglePipelineConnection()"
                    style="margin-left:16px;padding:7px 14px;font-size:12px;font-weight:600;border:1px solid #fca5a5;border-radius:6px;background:#fef2f2;color:#dc2626;cursor:pointer;white-space:nowrap;">
                    Disconnect
                </button>
            </div>

            <!-- Calibration fields -->
            <div style="font-size:11px;font-weight:600;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;margin-bottom:14px;">Calibration</div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">

                <!-- Zero State -->
                <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;">
                    <div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Zero State (Tare Offset)</div>
                    <div style="font-size:22px;font-weight:700;color:#1e293b;margin-bottom:10px;" id="cal-zero-display">--</div>
                    <button onclick="captureZero()"
                        style="width:100%;padding:7px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:5px;background:#fff;color:#475569;cursor:pointer;">
                        Capture Zero
                    </button>
                </div>

                <!-- Known Weight -->
                <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;">
                    <div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Known Weight (kg)</div>
                    <input id="cal-weight-input" type="number" placeholder="e.g. 1000"
                        style="width:100%;font-size:22px;font-weight:700;color:#1e293b;border:none;background:transparent;outline:none;padding:0;margin-bottom:10px;box-sizing:border-box;" />
                    <div style="font-size:10px;color:#94a3b8;">Raw at this weight:</div>
                    <div style="font-size:15px;font-weight:600;color:#475569;" id="cal-weight-raw-display">-- (use current raw)</div>
                </div>
            </div>

            <!-- Note -->
            <div style="margin-bottom:16px;">
                <div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Note</div>
                <textarea id="cal-note" rows="2" placeholder="Calibration note (optional)"
                    style="width:100%;font-size:13px;color:#1e293b;border:1px solid #e2e8f0;border-radius:6px;padding:8px;resize:none;outline:none;box-sizing:border-box;font-family:sans-serif;"></textarea>
            </div>

            <!-- Save -->
            <button onclick="saveCalibration()"
                style="width:100%;padding:11px;font-size:14px;font-weight:600;border:none;border-radius:7px;background:#2563eb;color:#fff;cursor:pointer;">
                Save Calibration
            </button>

            <div id="cal-status" style="margin-top:10px;font-size:12px;color:#64748b;text-align:center;min-height:18px;"></div>

        </div>
    </div>
</div>

<style>
@keyframes lcpulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
