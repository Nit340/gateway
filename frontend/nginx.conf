server {
    listen 5550;
    server_name localhost;

    # ---------- SERVE STATIC FILES ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- HTTP API ----------
    # FIX: no trailing slash on proxy_pass — preserves the /api/ prefix
    # so backend receives /api/devices, not just devices
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- WEBSOCKET ----------
    # FIX: no trailing slash on proxy_pass — preserves /ws and /ws/devices paths
    # so backend receives /ws or /ws/devices, not / or devices
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_cache_bypass $http_upgrade;
    }

    # ---------- WEBSOCKET (exact /ws path) ----------
    # The /ws/ block above only matches paths WITH a trailing slash or subpath.
    # Add an exact-match block for the bare /ws endpoint too.
    location = /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_cache_bypass $http_upgrade;
    }
}