<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Crane Monitor – Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; }
  .mat { font-family: 'Material Symbols Outlined'; font-style: normal; }
  @keyframes ping { 75%,100%{transform:scale(2);opacity:0} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .fade-up { animation: fadeUp .45s ease both; }
  .fade-up-2 { animation: fadeUp .45s .1s ease both; }
  .fade-up-3 { animation: fadeUp .45s .2s ease both; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden" style="background:#fb923c;">

<!-- Background blobs -->
<div class="absolute inset-0 pointer-events-none">
  <div class="absolute top-[-8%] left-[-5%] w-[55%] h-[55%] rounded-full" style="background:rgba(255,255,255,0.12);filter:blur(120px);"></div>
  <div class="absolute bottom-[-8%] right-[-5%] w-[50%] h-[50%] rounded-full" style="background:rgba(234,88,12,0.15);filter:blur(100px);"></div>
</div>

<main class="relative z-10 w-full max-w-[440px] px-5">
  <div class="bg-white rounded-3xl shadow-2xl p-10 border border-orange-50 fade-up">

    <!-- Logo -->
    <div class="text-center mb-9 fade-up">
      <div class="inline-flex h-20 w-20 items-center justify-center rounded-2xl mb-5 shadow-lg" style="background:#f97316;box-shadow:0 8px 24px rgba(249,115,22,0.35);">
        <span class="mat text-white" style="font-size:44px;">precision_manufacturing</span>
      </div>
      <h1 class="text-2xl font-extrabold text-stone-800 tracking-tight">UNIVA</h1>
      <p class="mt-1 text-sm text-stone-400 font-medium">Admin Console</p>
    </div>

    <!-- Error banner -->
    <div id="errBanner" class="hidden mb-5 flex items-center gap-2.5 px-4 py-3 rounded-xl text-sm font-medium" style="background:#fef2f2;border:1.5px solid #fecaca;color:#dc2626;">
      <span class="mat text-base">error</span>
      <span id="errMsg">Invalid credentials.</span>
    </div>

    <!-- Form -->
    <div class="space-y-5 fade-up-2">
      <!-- Username -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-widest text-stone-400 mb-2">Username</label>
        <div class="relative">
          <span class="mat absolute left-3.5 top-1/2 -translate-y-1/2 text-[20px]" style="color:#f97316;">badge</span>
          <input id="username" type="text" autocomplete="username" placeholder="admin"
            class="w-full rounded-xl py-3.5 pl-11 pr-4 text-stone-800 text-sm outline-none transition-all"
            style="border:2px solid #fed7aa;background:#fff;"
            onfocus="this.style.borderColor='#f97316'" onblur="this.style.borderColor='#fed7aa'"/>
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-widest text-stone-400 mb-2">Password</label>
        <div class="relative">
          <span class="mat absolute left-3.5 top-1/2 -translate-y-1/2 text-[20px]" style="color:#f97316;">vpn_key</span>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"
            class="w-full rounded-xl py-3.5 pl-11 pr-4 text-stone-800 text-sm outline-none transition-all"
            style="border:2px solid #fed7aa;background:#fff;"
            onfocus="this.style.borderColor='#f97316'" onblur="this.style.borderColor='#fed7aa'"/>
        </div>
      </div>

      <!-- Submit -->
      <button id="loginBtn" onclick="doLogin()"
        class="group w-full flex items-center justify-center gap-2.5 rounded-xl py-3.5 text-sm font-bold text-white transition-all active:scale-[0.98]"
        style="background:#ea580c;box-shadow:0 6px 20px rgba(234,88,12,0.3);">
        <span id="btnText">Access Admin Panel</span>
        <span class="mat text-[18px] transition-transform group-hover:translate-x-1" id="btnIcon">arrow_forward</span>
        <svg id="spinner" class="hidden animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="white" stroke-width="3" stroke-dasharray="32" stroke-dashoffset="12"/>
        </svg>
      </button>
    </div>

    <!-- Footer -->
    <p class="text-center text-[11px] text-stone-300 font-semibold uppercase tracking-widest mt-8 fade-up-3">
      Gateway Management System
    </p>
  </div>

  <!-- Status badges -->
  <div class="flex justify-center gap-3 mt-5">
    <div class="flex items-center gap-2 px-4 py-2 rounded-full text-white text-xs font-bold" style="background:rgba(255,255,255,0.2);backdrop-filter:blur(8px);">
      <span class="relative flex h-2 w-2">
        <span style="animation:ping 1.2s cubic-bezier(0,0,0.2,1) infinite;position:absolute;inset:0;border-radius:50%;background:white;opacity:0.4;"></span>
        <span style="position:relative;border-radius:50%;background:white;width:8px;height:8px;display:block;"></span>
      </span>
      SYSTEM ONLINE
    </div>
    <div class="flex items-center gap-2 px-4 py-2 rounded-full text-white text-xs font-bold" style="background:rgba(255,255,255,0.2);backdrop-filter:blur(8px);">
      <span class="mat" style="font-size:15px;color:rgba(255,235,200,0.9);">sensors</span>
      SERVER CONNECTED
    </div>
  </div>
</main>

<script>
  document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('username').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('password').focus(); });

  async function doLogin() {
    const btn  = document.getElementById('loginBtn');
    const errB = document.getElementById('errBanner');
    const errM = document.getElementById('errMsg');
    const u    = document.getElementById('username').value.trim();
    const p    = document.getElementById('password').value;

    errB.classList.add('hidden');
    if (!u || !p) {
      errM.textContent = 'Please enter username and password.';
      errB.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    document.getElementById('btnText').classList.add('hidden');
    document.getElementById('btnIcon').classList.add('hidden');
    document.getElementById('spinner').classList.remove('hidden');

    try {
      const res  = await fetch('/admin/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username: u, password: p})
      });
      const data = await res.json();
      if (data.success) {
        window.location.replace('/admin');
      } else {
        errM.textContent = data.error || 'Invalid credentials.';
        errB.classList.remove('hidden');
        document.getElementById('password').value = '';
      }
    } catch(e) {
      errM.textContent = 'Could not reach server. Please try again.';
      errB.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      document.getElementById('btnText').classList.remove('hidden');
      document.getElementById('btnIcon').classList.remove('hidden');
      document.getElementById('spinner').classList.add('hidden');
    }
  }
</script>
</body>
</html>
