<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Univa – Database</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap" rel="stylesheet"/>
<style>
  * { font-family: 'Inter', sans-serif; }
  .mat { font-family: 'Material Symbols Outlined'; font-style: normal; font-size: 20px; line-height:1; }
  .sidebar-link { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; font-size:13px; font-weight:600; color:#78716c; text-decoration:none; transition:all .15s; cursor:pointer; }
  .sidebar-link:hover { background:#fff7ed; color:#ea580c; }
  .sidebar-link.active { background:#ea580c; color:white; }
  .sidebar-link.active .mat,.sidebar-link.active:hover .mat { color:white; }
  .sidebar-link:hover .mat { color:#ea580c; }
  th { background:#fffaf7; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#78716c; padding:8px 10px; text-align:left; border-bottom:1.5px solid #fed7aa; white-space:nowrap; }
  td { font-size:12px; color:#44403c; padding:8px 10px; border-bottom:1px solid #f5f5f4; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  tr:hover td { background:#fffaf7; }
  input.field { width:100%; padding:8px 10px; border:1.5px solid #e7e5e4; border-radius:8px; font-size:13px; outline:none; transition:border-color .15s; }
  input.field:focus { border-color:#f97316; }
  .table-pill { display:inline-block; padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; transition:all .15s; }
  .table-pill:hover { background:#fff7ed; color:#ea580c; }
  .table-pill.active { background:#ea580c; color:white; }
  ::-webkit-scrollbar { width:5px; height:5px; } ::-webkit-scrollbar-thumb { background:#e7cfc7; border-radius:10px; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:50; display:flex; align-items:center; justify-content:center; }
  .modal { background:white; border-radius:20px; padding:28px; width:520px; max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.15); }
</style>
</head>
<body class="bg-stone-50 min-h-screen flex">

<!-- Sidebar -->
<aside class="w-60 min-h-screen flex flex-col flex-shrink-0" style="background:#fffaf7;border-right:1.5px solid #fed7aa;">
  <div class="px-5 py-6 flex items-center gap-3 border-b" style="border-color:#fed7aa;">
    <div class="flex h-10 w-10 items-center justify-center rounded-xl" style="background:#f97316;">
      <span class="mat text-white" style="font-size:22px;">precision_manufacturing</span>
    </div>
    <div>
      <div class="text-sm font-extrabold text-stone-800">Univa</div>
      <div class="text-[10px] text-stone-400 font-semibold uppercase tracking-wider">Admin Panel</div>
    </div>
  </div>
  <nav class="flex-1 px-3 py-5 space-y-1">
    <div class="text-[9px] font-bold uppercase tracking-widest text-stone-300 px-2 mb-3">Main</div>
    <a href="/admin" class="sidebar-link"><span class="mat">dashboard</span> Dashboard</a>
    <a href="/admin/pipeline" class="sidebar-link"><span class="mat">device_hub</span> Pipeline</a>
    <a href="/admin/database" class="sidebar-link active"><span class="mat">table_chart</span> Database</a>
    <div class="text-[9px] font-bold uppercase tracking-widest text-stone-300 px-2 mt-5 mb-3">Users</div>
    <a href="/admin/users" class="sidebar-link"><span class="mat">manage_accounts</span> Users</a>
    <a href="/admin/access-control" class="sidebar-link"><span class="mat">shield_lock</span> Access Control</a>
  </nav>
  <div class="px-3 py-4 border-t" style="border-color:#fed7aa;">
    <button onclick="logout()" class="sidebar-link w-full text-left" style="color:#a8a29e;">
      <span class="mat">logout</span> Logout
    </button>
  </div>
</aside>

<!-- Main -->
<div class="flex-1 flex flex-col min-w-0">
  <header class="h-14 bg-white border-b border-stone-100 flex items-center px-6 gap-4 flex-shrink-0">
    <h1 class="text-base font-bold text-stone-800 flex-1">Database Manager</h1>
    <button onclick="openInsertModal()" id="insertBtn"
      class="hidden flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold text-white"
      style="background:#ea580c;">
      <span class="mat" style="font-size:16px;">add</span> Insert Row
    </button>
  </header>

  <div class="flex-1 flex min-h-0">
    <!-- Table list -->
    <div class="w-52 flex-shrink-0 border-r border-stone-100 bg-white overflow-y-auto py-4">
      <div class="px-4 text-[9px] font-bold uppercase tracking-widest text-stone-300 mb-3">Tables</div>
      <div id="tableList" class="px-3 space-y-1 text-xs font-semibold text-stone-500"></div>
    </div>

    <!-- Table data -->
    <div class="flex-1 overflow-auto p-5">
      <div id="tableArea" class="text-sm text-stone-400 pt-10 text-center">
        Select a table from the left panel.
      </div>
    </div>
  </div>
</div>

<!-- Modal for insert/edit -->
<div id="modal" class="modal-bg hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-base font-bold text-stone-800" id="modalTitle">Insert Row</h2>
      <button onclick="closeModal()" class="text-stone-400 hover:text-stone-600">
        <span class="mat">close</span>
      </button>
    </div>
    <div id="modalFields" class="space-y-3"></div>
    <div class="flex gap-3 mt-6">
      <button onclick="submitModal()"
        class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white"
        style="background:#ea580c;" id="modalSubmitBtn">Save</button>
      <button onclick="closeModal()"
        class="flex-1 py-2.5 rounded-xl text-sm font-bold text-stone-500 border border-stone-200">Cancel</button>
    </div>
    <div id="modalErr" class="hidden mt-3 text-xs text-red-500 font-semibold"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-6 right-6 px-4 py-3 rounded-xl text-sm font-bold text-white z-50"></div>

<script>
  let currentTable = null;
  let currentColumns = [];
  let currentRows = [];
  let editRowId = null;

  async function logout() { await fetch('/admin/logout'); window.location.href='/admin/login'; }

  function toast(msg, ok=true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'fixed bottom-6 right-6 px-4 py-3 rounded-xl text-sm font-bold text-white z-50 ' + (ok?'bg-green-500':'bg-red-500');
    t.classList.remove('hidden');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.add('hidden'), 3000);
  }

  // Load table list
  async function loadTables() {
    const r = await fetch('/api/admin/db/tables');
    const d = await r.json();
    const list = document.getElementById('tableList');
    list.innerHTML = (d.tables||[]).map(t =>
      `<div class="table-pill px-2 py-1.5 text-stone-600" onclick="selectTable('${t}')" id="pill-${t}">${t}</div>`
    ).join('');
  }

  async function selectTable(name) {
    currentTable = name;
    // Update pills
    document.querySelectorAll('.table-pill').forEach(p => p.classList.remove('active'));
    document.getElementById('pill-'+name)?.classList.add('active');
    document.getElementById('insertBtn').classList.remove('hidden');
    await loadTableData();
  }

  async function loadTableData() {
    if (!currentTable) return;
    document.getElementById('tableArea').innerHTML = '<div class="text-stone-400 text-sm">Loading…</div>';
    try {
      const r = await fetch('/api/admin/db/table/'+currentTable);
      const d = await r.json();
      currentColumns = d.columns || [];
      currentRows    = d.rows    || [];
      renderTable();
    } catch(e) {
      document.getElementById('tableArea').innerHTML = '<div class="text-red-400">Error: '+e.message+'</div>';
    }
  }

  function renderTable() {
    if (!currentRows.length) {
      document.getElementById('tableArea').innerHTML = `
        <div class="bg-white rounded-2xl border border-stone-100 overflow-hidden">
          <div class="p-5 text-xs font-bold uppercase tracking-wide text-stone-400 border-b border-stone-100">${currentTable}</div>
          <div class="p-8 text-center text-stone-300 text-sm">No records found</div>
        </div>`;
      return;
    }
    const cols = currentColumns;
    let html = `<div class="bg-white rounded-2xl border border-stone-100 overflow-hidden">
      <div class="px-5 py-3 flex items-center justify-between border-b border-stone-100">
        <div class="text-xs font-bold uppercase tracking-wide text-stone-500">${currentTable}</div>
        <div class="text-xs text-stone-400">${currentRows.length} row${currentRows.length!==1?'s':''}</div>
      </div>
      <div class="overflow-x-auto">
      <table class="w-full"><thead><tr>`;
    cols.forEach(c => { html += `<th>${c}</th>`; });
    html += '<th class="text-right">Actions</th></tr></thead><tbody>';
    currentRows.forEach(row => {
      html += '<tr>';
      cols.forEach(c => {
        const v = row[c] === null || row[c] === undefined ? '' : String(row[c]);
        html += `<td title="${v.replace(/"/g,'&quot;')}">${v.length>60?v.slice(0,60)+'…':v}</td>`;
      });
      html += `<td class="text-right whitespace-nowrap">
        <button onclick='openEditModal(${JSON.stringify(row)})' class="text-blue-500 hover:underline text-xs font-semibold mr-3">Edit</button>
        <button onclick='deleteRow("${row.id}")' class="text-red-400 hover:underline text-xs font-semibold">Delete</button>
      </td></tr>`;
    });
    html += '</tbody></table></div></div>';
    document.getElementById('tableArea').innerHTML = html;
  }

  // --- Modal ---
  function openInsertModal() {
    editRowId = null;
    document.getElementById('modalTitle').textContent = 'Insert Row into ' + currentTable;
    document.getElementById('modalSubmitBtn').textContent = 'Insert';
    const fields = document.getElementById('modalFields');
    fields.innerHTML = currentColumns.filter(c=>c!=='id'&&c!=='created_at'&&c!=='updated_at').map(c =>
      `<div><label class="block text-xs font-semibold text-stone-500 mb-1">${c}</label>
       <input class="field" id="mf-${c}" type="text" placeholder="${c}"/></div>`
    ).join('');
    document.getElementById('modalErr').classList.add('hidden');
    document.getElementById('modal').classList.remove('hidden');
  }

  function openEditModal(row) {
    editRowId = row.id;
    document.getElementById('modalTitle').textContent = 'Edit Row #' + row.id + ' in ' + currentTable;
    document.getElementById('modalSubmitBtn').textContent = 'Update';
    const fields = document.getElementById('modalFields');
    fields.innerHTML = currentColumns.filter(c=>c!=='id'&&c!=='created_at'&&c!=='updated_at').map(c =>
      `<div><label class="block text-xs font-semibold text-stone-500 mb-1">${c}</label>
       <input class="field" id="mf-${c}" type="text" value="${row[c]===null||row[c]===undefined?'':row[c]}"/></div>`
    ).join('');
    document.getElementById('modalErr').classList.add('hidden');
    document.getElementById('modal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    editRowId = null;
  }

  async function submitModal() {
    const errEl = document.getElementById('modalErr');
    errEl.classList.add('hidden');
    const data = {};
    currentColumns.filter(c=>c!=='id'&&c!=='created_at'&&c!=='updated_at').forEach(c => {
      const el = document.getElementById('mf-'+c);
      if (el) data[c] = el.value.trim() || null;
    });
    try {
      let r;
      if (editRowId !== null) {
        r = await fetch(`/api/admin/db/table/${currentTable}/${editRowId}`, {
          method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
        });
      } else {
        r = await fetch(`/api/admin/db/table/${currentTable}`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
        });
      }
      const d = await r.json();
      if (d.success) {
        closeModal();
        toast(editRowId ? 'Row updated!' : 'Row inserted!');
        await loadTableData();
      } else {
        errEl.textContent = d.error || 'Operation failed.';
        errEl.classList.remove('hidden');
      }
    } catch(e) {
      errEl.textContent = e.message;
      errEl.classList.remove('hidden');
    }
  }

  async function deleteRow(id) {
    if (!confirm('Delete row #'+id+' from '+currentTable+'?')) return;
    try {
      const r = await fetch(`/api/admin/db/table/${currentTable}/${id}`, {method:'DELETE'});
      const d = await r.json();
      if (d.success) {
        toast('Row deleted.');
        await loadTableData();
      } else {
        toast('Delete failed: '+(d.error||''), false);
      }
    } catch(e) {
      toast('Error: '+e.message, false);
    }
  }

  loadTables();
</script>
</body>
</html>
