<div class="space-y-6">
    <!-- Connection Configuration Tab -->
    <div id="http-connection-content" class="http-tab-content form-section">
        <h5 class="form-section-title">Connection Configuration</h5>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Endpoint URL</label>
                <input type="text" id="field-url" value="https://api.company.com/v1/data" class="w-full compact-input" placeholder="https://api.example.com/endpoint">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Method</label>
                    <select id="field-method" class="w-full compact-select">
                        <option value="POST" selected>POST</option>
                        <option value="GET">GET</option>
                        <option value="PUT">PUT</option>
                        <option value="PATCH">PATCH</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Interval</label>
                    <div class="flex items-center">
                        <input type="number" id="field-interval" value="300" class="w-full compact-input">
                        <span class="ml-2 text-xs text-slate-700">sec</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Payload Configuration Tab -->
    <div id="http-payload-content" class="http-tab-content form-section" style="display: none;">
        <h5 class="form-section-title">Payload Configuration</h5>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Content Type</label>
                <select id="field-contentType" class="w-full compact-select">
                    <option value="application/json" selected>application/json</option>
                    <option value="application/xml">application/xml</option>
                    <option value="text/plain">text/plain</option>
                    <option value="application/x-www-form-urlencoded">application/x-www-form-urlencoded</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Batch Size</label>
                <input type="number" id="field-batchSize" value="100" class="w-full compact-input" placeholder="Number of records per request">
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Custom Headers</label>
                <div class="key-value-list">
                    <div class="key-value-item">
                        <input type="text" placeholder="Key" class="compact-input">
                        <input type="text" placeholder="Value" class="compact-input">
                        <button type="button" class="text-red-600 hover:text-red-700" onclick="CloudConnectionManager.removeKeyValueItem(this)">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <div class="p-2">
                        <button type="button" onclick="CloudConnectionManager.addKeyValueItem(this)" class="text-xs text-primary hover:text-primaryHover">
                            <i class="fa-solid fa-plus mr-1"></i> Add Header
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Tab Navigation -->
    <div class="flex border-b border-border mt-6">
        <button class="tab-button active" onclick="CloudConnectionManager.switchHttpTab('connection')">Connection</button>
        <button class="tab-button" onclick="CloudConnectionManager.switchHttpTab('payload')">Payload</button>
    </div>
</div>
