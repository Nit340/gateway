<div class="space-y-6">
    <!-- Connection Configuration Tab -->
    <div id="mqtt-connection-content" class="mqtt-tab-content form-section">
        <h5 class="form-section-title">Connection Configuration</h5>
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Host / Broker</label>
                    <input type="text" id="field-host" value="broker.company.com" class="w-full compact-input" placeholder="mqtt.example.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Port</label>
                    <input type="number" id="field-port" value="8883" class="w-full compact-input" placeholder="1883">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Protocol</label>
                <div class="flex space-x-4">
                    <label class="flex items-center">
                        <input type="radio" name="field-protocol" value="mqtt" class="mr-2" checked>
                        <span class="text-xs">MQTT</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="field-protocol" value="mqtts" class="mr-2">
                        <span class="text-xs">MQTTS (SSL/TLS)</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="field-protocol" value="ws" class="mr-2">
                        <span class="text-xs">WebSocket</span>
                    </label>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Client ID</label>
                    <input type="text" id="field-clientId" value="univa-gw-01" class="w-full compact-input" placeholder="Client ID">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">QoS Level</label>
                    <select id="field-qos" class="w-full compact-select">
                        <option value="0">0 - At most once</option>
                        <option value="1" selected>1 - At least once</option>
                        <option value="2">2 - Exactly once</option>
                    </select>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" id="field-username" value="admin" class="w-full compact-input" placeholder="Username">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
                    <div class="form-input-group">
                        <input type="password" id="field-password" class="w-full compact-input" placeholder="Password">
                        <button type="button" onclick="CloudConnectionManager.generatePassword('field-password')" class="compact-button border border-slate-300 text-slate-700 hover:bg-slate-50 text-xs">
                            <i class="fa-solid fa-key"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Topics & Format Tab -->
    <div id="mqtt-topics-content" class="mqtt-tab-content form-section" style="display: none;">
        <h5 class="form-section-title">Topics & Format</h5>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Publish Topic</label>
                <input type="text" id="field-publishTopic" value="gateway/data" class="w-full compact-input" placeholder="gateway/+/data">
                <p class="text-xs text-slate-500 mt-1">Use + for single-level wildcard, # for multi-level wildcard</p>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Subscribe Topic</label>
                <input type="text" id="field-subscribeTopic" value="gateway/commands" class="w-full compact-input" placeholder="gateway/commands">
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Data Format</label>
                <select id="field-dataFormat" class="w-full compact-select">
                    <option value="json">JSON</option>
                    <option value="csv">CSV</option>
                    <option value="xml">XML</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
        </div>
    </div>
    
    <!-- Publishing Tab -->
    <div id="mqtt-publishing-content" class="mqtt-tab-content form-section" style="display: none;">
        <h5 class="form-section-title">Publishing Rules</h5>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Publishing Interval</label>
                <div class="flex items-center">
                    <input type="number" id="field-interval" value="60" class="w-24 compact-input">
                    <span class="ml-2 text-xs text-slate-700">seconds</span>
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Retain Messages</label>
                <div class="flex items-center">
                    <label class="toggle-switch">
                        <input type="checkbox" id="field-retain" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="ml-2 text-xs text-slate-700">Keep messages on broker for new subscribers</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Advanced Tab -->
    <div id="mqtt-advanced-content" class="mqtt-tab-content form-section" style="display: none;">
        <h5 class="form-section-title">Advanced Settings</h5>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Keep Alive Interval</label>
                <div class="flex items-center">
                    <input type="number" id="field-keepAlive" value="60" class="w-24 compact-input">
                    <span class="ml-2 text-xs text-slate-700">seconds</span>
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Clean Session</label>
                <div class="flex items-center">
                    <label class="toggle-switch">
                        <input type="checkbox" id="field-cleanSession" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="ml-2 text-xs text-slate-700">Start with clean session state</span>
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">TLS/SSL Settings</label>
                <div class="space-y-2">
                    <div class="flex items-center">
                        <label class="toggle-switch">
                            <input type="checkbox" id="field-tls" checked>
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="ml-2 text-xs text-slate-700">Enable TLS/SSL encryption</span>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1 mt-2">Custom Headers</label>
                        <div class="key-value-list">
                            <div class="key-value-item">
                                <input type="text" placeholder="Key" class="compact-input">
                                <input type="text" placeholder="Value" class="compact-input">
                                <button type="button" class="text-red-600 hover:text-red-700" onclick="CloudConnectionManager.removeKeyValueItem(this)">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                            <div class="p-2">
                                <button type="button" onclick="CloudConnectionManager.addKeyValueItem(this)" class="text-xs text-primary hover:text-primaryHover">
                                    <i class="fa-solid fa-plus mr-1"></i> Add Header
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Tab Navigation -->
    <div class="flex border-b border-border mt-6">
        <button class="tab-button active" onclick="CloudConnectionManager.switchMqttTab('connection')">Connection</button>
        <button class="tab-button" onclick="CloudConnectionManager.switchMqttTab('topics')">Topics & Format</button>
        <button class="tab-button" onclick="CloudConnectionManager.switchMqttTab('publishing')">Publishing</button>
        <button class="tab-button" onclick="CloudConnectionManager.switchMqttTab('advanced')">Advanced</button>
    </div>
</div>
